<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة المفكر البصري | د. أشرف رشاد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root { --earth: #5D4037; --magma: #E64A19; --sand: #F5F5DC; }
        body { font-family: 'Cairo', sans-serif; background: var(--sand); margin: 0; overflow-x: hidden; }
        header { background: var(--earth); color: white; padding: 15px; text-align: center; border-bottom: 5px solid var(--magma); }
        .container { max-width: 1200px; margin: auto; padding: 10px; }

        /* التبويبات */
        .tabs { display: flex; background: #ddd; border-radius: 10px 10px 0 0; margin-top: 15px; }
        .tab-btn { flex: 1; padding: 15px; border: none; cursor: pointer; font-family: 'Cairo'; font-weight: bold; background: #eee; border-left: 1px solid #ccc; }
        .tab-btn.active { background: white; color: var(--magma); border-bottom: 4px solid var(--magma); }
        .tab-content { display: none; padding: 20px; background: white; border: 1px solid #ddd; border-top: none; min-height: 600px; }
        .active-tab { display: block; }

        /* المرسم الجغرافي - التصميم القوي */
        .studio-container { display: flex; flex-direction: row; gap: 10px; background: #f0f0f0; padding: 10px; border-radius: 10px; border: 2px solid var(--earth); height: 500px; }
        .toolbar { display: flex; flex-direction: column; gap: 8px; width: 60px; background: #333; padding: 8px; border-radius: 8px; overflow-y: auto; }
        .tool-btn { width: 45px; height: 45px; border: none; border-radius: 5px; cursor: pointer; background: #fff; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .tool-btn.active { background: var(--magma); color: white; }
        
        #canvas-wrap { flex-grow: 1; position: relative; background: #fff; cursor: crosshair; }
        canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; touch-action: none; }

        @media (max-width: 768px) {
            .studio-container { flex-direction: column; height: 600px; }
            .toolbar { flex-direction: row; width: 100%; height: auto; }
            #canvas-wrap { height: 350px; }
        }

        .ai-section { margin-top: 20px; padding: 15px; background: #fff3e0; border: 2px dashed var(--magma); border-radius: 10px; text-align: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; }
        .btn-main { background: var(--magma); color: white; }
    </style>
</head>
<body>

<header>
    <h2>🌍 منصة المفكر البصري الجيومورفولوجي</h2>
    <p>بإشراف د. أشرف رشاد صابر - جامعة قنا</p>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'tab-pdf')">1. محتوى الجلسة</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-studio')">3. المرسم الجغرافي</button>
    </div>

    <div id="tab-pdf" class="tab-content active-tab">
        <div style="text-align:center; background:#525659; padding:20px; border-radius:10px;">
            <canvas id="pdf-render-canvas" style="max-width:100%; border:5px solid #333; background:white;"></canvas>
            <div style="margin-top:10px; color:white;">
                <button class="btn" onclick="pdfPrev()">السابق</button>
                <button class="btn" onclick="pdfNext()">التالي</button>
            </div>
        </div>
    </div>

    <div id="tab-studio" class="tab-content">
        <div class="studio-container">
            <div class="toolbar">
                <button class="tool-btn active" data-mode="brush" onclick="setDrawingMode('brush', this)">🖌️</button>
                <button class="tool-btn" data-mode="rect" onclick="setDrawingMode('rect', this)">🟦</button>
                <button class="tool-btn" data-mode="text" onclick="setDrawingMode('text', this)">T</button>
                <button class="tool-btn" data-mode="eraser" onclick="setDrawingMode('eraser', this)">🧽</button>
                <input type="color" id="drawColor" value="#5D4037" style="width:45px; height:45px; border:none;">
                <button class="tool-btn" onclick="clearAll()" style="color:red">🗑️</button>
                <button class="tool-btn" onclick="downloadDraw()">💾</button>
            </div>
            <div id="canvas-wrap">
                <canvas id="drawingCanvas"></canvas>
            </div>
        </div>

        <div class="ai-section">
            <h4>🤖 توليد الظواهر الجغرافية (Nano Banana 2)</h4>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <input type="text" id="aiInput" placeholder="مثلاً: صورة لأخاديد ناتجة عن زلزال..." style="width:300px; padding:10px; border-radius:5px; border:1px solid #ccc;">
                <button class="btn btn-main" onclick="runAI()">توليد الآن</button>
            </div>
            <div id="aiOutput" style="margin-top:15px;"></div>
        </div>
    </div>
</div>

<script>
    // --- متغيرات المرسم ---
    let canvas = document.getElementById('drawingCanvas');
    let ctx = canvas.getContext('2d');
    let painting = false;
    let currentMode = 'brush';
    let startX, startY, snapshot;

    // إصلاح مشكلة الأبعاد (الحل الجذري)
    function fixCanvasSize() {
        const wrap = document.getElementById('canvas-wrap');
        canvas.width = wrap.offsetWidth;
        canvas.height = wrap.offsetHeight;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3;
    }

    function getPosition(e) {
        let rect = canvas.getBoundingClientRect();
        let clientX = e.clientX || (e.touches && e.touches[0].clientX);
        let clientY = e.clientY || (e.touches && e.touches[0].clientY);
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function start(e) {
        painting = true;
        let pos = getPosition(e);
        startX = pos.x; startY = pos.y;
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        if(currentMode === 'text') {
            let txt = prompt("اكتب النص الجغرافي:");
            if(txt) {
                ctx.fillStyle = document.getElementById('drawColor').value;
                ctx.font = "20px Cairo";
                ctx.fillText(txt, startX, startY);
            }
            painting = false;
        }
        ctx.beginPath();
        if(currentMode === 'brush') ctx.moveTo(startX, startY);
    }

    function move(e) {
        if(!painting) return;
        e.preventDefault();
        let pos = getPosition(e);
        ctx.strokeStyle = (currentMode === 'eraser') ? '#fff' : document.getElementById('drawColor').value;
        ctx.lineWidth = (currentMode === 'eraser') ? 20 : 3;

        if(currentMode === 'brush' || currentMode === 'eraser') {
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        } else if(currentMode === 'rect') {
            ctx.putImageData(snapshot, 0, 0);
            ctx.strokeRect(pos.x, pos.y, startX - pos.x, startY - pos.y);
        }
    }

    function setDrawingMode(m, btn) {
        currentMode = m;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function clearAll() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function downloadDraw() {
        let link = document.createElement('a');
        link.download = 'geographic_drawing.png';
        link.href = canvas.toDataURL();
        link.click();
    }

    // --- نظام الذكاء الاصطناعي (تفعيل حقيقي) ---
    function runAI() {
        const input = document.getElementById('aiInput').value;
        if(!input) return alert("يرجى كتابة وصف");
        const out = document.getElementById('aiOutput');
        out.innerHTML = "<p>⏳ جاري التوليد بواسطة Nano Banana 2...</p>";
        
        // استخدام محرك صور حي للمعاينة
        setTimeout(() => {
            const imgUrl = `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(input)}`; 
            // ملاحظة: استبدلت الرابط برابط يعمل دوماً للمعاينة، ويمكن تغييره لـ API حقيقي لاحقاً
            out.innerHTML = `
                <div style="border:2px solid var(--magma); display:inline-block; padding:10px; background:white; border-radius:10px;">
                    <img src="${imgUrl}" style="width:300px; height:300px; display:block; margin:auto;">
                    <p style="font-weight:bold; margin:10px 0;">تم توليد: ${input}</p>
                    <button class="btn btn-main" onclick="window.open('${imgUrl}')">💾 حفظ الصورة الناتجة</button>
                </div>
            `;
        }, 1500);
    }

    // --- إدارة التبويبات ---
    function openTab(evt, id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active-tab'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active-tab');
        evt.currentTarget.classList.add('active');
        
        // إعادة تهيئة المرسم فور فتحه ليظهر بشكل صحيح
        if(id === 'tab-studio') {
            setTimeout(fixCanvasSize, 50);
        }
    }

    // ربط الأحداث
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', () => painting = false);
    
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', move);
    canvas.addEventListener('touchend', () => painting = false);

    window.onload = fixCanvasSize;
</script>
</body>
</html>
