<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة المحقق البصري | نسخة الإجابة النموذجية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --earth: #5D4037; --magma: #E64A19; --sand: #F5F5DC; --river: #1976D2; --success: #2E7D32; }
        body { font-family: 'Cairo', sans-serif; background: var(--sand); margin: 0; }
        header { background: var(--earth); color: white; padding: 20px; text-align: center; border-bottom: 5px solid var(--magma); }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        
        /* التنسيقات العامة */
        #login-screen, #main-menu, #activity-screen { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .card { padding: 20px; border: 2px solid #eee; border-radius: 15px; cursor: pointer; text-align: center; transition: 0.3s; }
        .card:hover { border-color: var(--magma); background: #fffcfb; }
        
        .skills-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; justify-content: center; }
        .skill-btn { padding: 8px 15px; border: 1px solid #ccc; border-radius: 20px; cursor: pointer; background: white; font-family: 'Cairo'; }
        .skill-btn.active { background: var(--magma); color: white; border: none; }

        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } }
        
        .geo-img { width: 100%; height: 350px; object-fit: contain; border-radius: 10px; border: 1px solid #ddd; }
        canvas { border: 2px solid var(--earth); width: 100%; height: 350px; background: white; border-radius: 10px; }
        
        /* صندوق الإجابة النموذجية */
        #model-answer-box { display: none; background: #e8f5e9; border: 2px dashed var(--success); padding: 15px; margin-top: 15px; border-radius: 10px; animation: slideDown 0.4s; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn { padding: 10px 25px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; margin: 5px; }
        .btn-main { background: var(--magma); color: white; }
        .btn-check { background: var(--river); color: white; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Cairo'; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>🌍 منصة المحقق البصري الجيومورفولوجي</h1>
    <p>إعداد الباحث: أشرف رشاد صابر | جامعة قنا</p>
</header>

<div class="container">
    <div id="login-screen">
        <h2>تسجيل بيانات الباحث الصغير</h2>
        <input type="text" id="s-name" placeholder="الاسم الرباعي" style="width:80%; padding:10px; margin:10px;"><br>
        <input type="text" id="s-group" placeholder="المجموعة" style="width:80%; padding:10px; margin:10px;"><br>
        <button class="btn btn-main" onclick="start()">ابدأ الرحلة التعليمية</button>
    </div>

    <div id="main-menu" style="display:none;">
        <div class="grid" id="menu-grid"></div>
    </div>

    <div id="activity-screen" style="display:none;">
        <h2 id="sess-title" style="color:var(--earth);"></h2>
        <div class="skills-nav" id="skill-tabs"></div>
        
        <div class="layout">
            <div class="work-area">
                <h3 id="skill-display" style="color:var(--magma);"></h3>
                <p id="task-display" style="font-weight:bold;"></p>
                <textarea id="stu-ans" placeholder="اكتب ملاحظاتك البصرية هنا..."></textarea>
                
                <div style="margin-top:15px;">
                    <button class="btn btn-check" id="check-btn" onclick="showModel()">👁️ تأكد من إجابتك</button>
                    <button class="btn" style="background:#4CAF50; color:white;" onclick="save()">💾 حفظ النشاط</button>
                </div>

                <div id="model-answer-box">
                    <h4 style="color:var(--success); margin:0;">✅ الإجابة النموذجية:</h4>
                    <p id="model-text"></p>
                </div>
            </div>

            <div class="media-area">
                <div id="draw-zone" style="display:none;">
                    <p>🎨 ارسم تصورك الذهني للظاهرة:</p>
                    <canvas id="canvas"></canvas>
                </div>
                <img id="task-img" class="geo-img" src="">
            </div>
        </div>
        <button class="btn" onclick="location.reload()" style="margin-top:20px;">🏠 العودة للقائمة</button>
    </div>
</div>

<script>
    const skills = ["القراءة البصرية", "التمييز البصرى", "إدراك العلاقات المكانية", "التحليل البصرى", "التفسير البصرى", "استنتاج المعنى", "التصور الذهنى"];
    
    // بيانات الجلسات الثمانية مع الإجابات النموذجية
    const data = [
        {
            name: "الزلازل", code: "quake",
            tasks: ["حدد مكونات الزلزال ص 4", "ميز بين البؤرة والمركز السطحي ص 6", "حدد اتجاه انتشار الموجات ص 8", "حلل رسم السيزموجراف ص 10", "فسر دمار المباني ص 12", "استنتج القوة من الرسم ص 13", "ارسم تصوراً لموجات تسونامي"],
            answers: [
                "تتكون من: البؤرة (نقطة الانطلاق)، المركز السطحي (النقطة المقابلة للبؤرة على السطح)، والصدع (مكان الكسر).",
                "البؤرة تقع في أعماق الأرض وهي مصدر الطاقة، أما المركز السطحي فهو النقطة الأقرب للبؤرة وتصل إليها الموجات أولاً.",
                "تنتشر الموجات الزلزالية بشكل دائري (كروي) من البؤرة في كافة الاتجاهات داخل طبقات الصخر.",
                "الجهاز يرسم خطوطاً (سيزموجرام)؛ الخطوط الطويلة تعني اهتزازاً قوياً، والقيرة تعني اهتزازاً ضعيفاً.",
                "يرجع الدمار لشدة الاهتزاز وقرب المباني من المركز السطحي، أو ضعف التربة التي بنيت عليها المنشآت.",
                "نستنتج القوة من (سعة الموجة)؛ كلما زاد ارتفاع الموجة في الرسم البياني زادت درجة الزلزال بمقياس ريختر.",
                "يجب أن يظهر الرسم حركة عمودية للمياه ناتجة عن زلزال بحري تؤدي لاندفاع كتل مائية ضخمة نحو اليابس."
            ]
        },
        {
            name: "البراكين", code: "vol",
            tasks: ["اقرأ أجزاء البركان ص 18", "ميز بين اللافا الحمضية والقاعدية ص 20", "حدد مكان غرفة الصهير ص 21", "حلل شكل المدخنة ص 22", "فسر تكون الفوهة ص 23", "استنتج نوع الثوران ص 24", "ارسم تصوراً لانفجار بركاني"],
            answers: [
                "الأجزاء الرئيسية: الخزان (الغرفة)، المدخنة (القصبة)، الفوهة، والمخروط البركاني.",
                "اللافا الحمضية لزجة وبطيئة الحركة (تكون مخروطاً حاداً)، والقاعدية سائلة وسريعة (تكون مخروطاً مفلطحاً).",
                "تقع غرفة الصهير (Magma Chamber) في أسفل القشرة الأرضية، وهي مستودع الماجما قبل خروجها.",
                "المدخنة هي القناة الواصلة من الغرفة للفوهة؛ قد تكون واحدة أو يتفرع منها مدخنات جانبية.",
                "تتكون الفوهة نتيجة اندفاع الغازات واللافا بقوة، أو نتيجة انهيار قمة البركان للداخل بعد الثوران.",
                "نستنتج قوة الثوران من شكل السحابة؛ السحابة الكثيفة السوداء تدل على ثوران انفجاري عنيف (بيلين).",
                "يجب أن يشمل الرسم تصاعد الغازات والرماد، وانسحاب اللافا على جانبي المخروط بشكل انسيابي."
            ]
        },
        {
            name: "الالتواءات", code: "fold",
            tasks: ["اقرأ أنواع الطيات ص 29", "ميز بين الطية المحدبة والمقعرة ص 30", "حدد محور الطية ص 31", "حلل ميل الطبقات ص 33", "فسر تكون الجبال الالتوائية ص 35", "استنتج اتجاه الضغط ص 36", "ارسم نموذجاً لثنية مركبة"],
            answers: [
                "الأنواع: الطية المحدبة (قوس لأعلى)، والطية المقعرة (قوس لأسفل).",
                "في المحدبة تتقوس الطبقات لأعلى وأقدم الطبقات في المركز، وفي المقعرة تتقوس لأسفل وأحدث الطبقات في المركز.",
                "المحور هو الخط الوهمي الذي تلتوي حوله الطبقات، ويقسم الطية إلى جناحين.",
                "في الطية غير المتماثلة، يميل أحد الجناحين بزاوية أكبر من الجناح الآخر نتيجة اختلاف قوة الضغط.",
                "تتكون نتيجة تعرض طبقات الصخور الرسوبية اللينة لضغوط جانبية شديدة لفترات زمنية طويلة.",
                "نستنتج اتجاه الضغط من جهة ميل الطية؛ فالطية تميل دائماً في الاتجاه المعاكس لجهة الضغط الأقوى.",
                "يجب أن يوضح الرسم تتابعاً من الطيات المحدبة والمقعرة المتصلة ببعضها البعض."
            ]
        },
        {
            name: "الانكسارات", code: "fault",
            tasks: ["تعرف على أنواع الصدوع ص 41", "ميز بين الصدع العادي والمعكوس ص 42", "حدد الحائط العلوي ص 44", "حلل إزاحة الطبقات ص 45", "فسر تكون الأغوار ص 47", "استنتج نوع الصدع من الرسم ص 48", "ارسم تصوراً لصدع مدرج"],
            answers: [
                "الأنواع: الصدع العادي (شد)، الصدع المعكوس (ضغط)، والصدع الأفقي (حركة جانبية).",
                "في الصدع العادي يتحرك الحائط العلوي لأسفل، وفي الصدع المعكوس يتحرك الحائط العلوي لأعلى.",
                "الحائط العلوي (Hanging Wall) هو كتلة الصخر التي تقع فوق مستوى سطح الصدع المائل.",
                "الإزاحة الرأسية تعني تحرك الكتل لأعلى أو لأسفل، والإزاحة الأفقية تعني تحركها بجانب بعضها.",
                "تتكون الأغوار (Rift Valleys) نتيجة هبوط الكتلة الواقعة بين صدعين عاديين متوازيين.",
                "إذا رأيت الطبقات متباعدة فهو (شد/عادي)، وإذا رأيتها متراكبة فوق بعضها فهو (ضغط/معكوس).",
                "يجب أن يظهر الرسم تتابعاً من الصدوع التي تهبط في نفس الاتجاه كأنها درجات سلم."
            ]
        },
        {
            name: "التجوية", code: "weather",
            tasks: ["اقرأ مظاهر التفتت ص 55", "ميز بين أثر الحرارة والصقيع ص 58", "حدد عمق التجوية ص 60", "حلل صورة صخر متحلل ص 63", "فسر تكون التربة ص 65", "استنتج مآل المعادن ص 67", "ارسم عملية تقشر الصخور"],
            answers: [
                "تظهر التجوية في صورة تفتت الصخر (ميكانيكي) أو تغير لونه وتركيبه (كيميائي).",
                "الحرارة تسبب تمدد وانكماش المعادن (تقشر)، والصقيع يسبب ضغطاً في الشقوق عند تجمد الماء (تحطم).",
                "تتأثر الطبقات السطحية بشكل أكبر، ويقل أثر التجوية كلما زاد العمق بعيداً عن الغلاف الجوي.",
                "يظهر الصخر فاقداً لصلابته، متغيراً في لونه (مثل الصدأ في الصخور الحديدية نتيجة الأكسدة).",
                "التربة هي نتاج تفتت الصخور واختلاطها بالمواد العضوية بفعل التجوية المستمرة عبر آلاف السنين.",
                "تتحول المعادن الصلبة (مثل الفلسبار) إلى معادن طينية لينة نتيجة التحلل الكيميائي بالماء.",
                "يجب أن يظهر الرسم انفصال طبقات رقيقة من سطح الصخر (مثل قشرة البصل) نتيجة التمدد الحراري."
            ]
        },
        {
            name: "التعرية الهوائية", code: "wind",
            tasks: ["اقرأ أشكال النحت ص 74", "ميز بين الكثبان الطولية والهلالية ص 78", "حدد اتجاه الرياح ص 80", "حلل الموائد الصحراوية ص 83", "فسر تجمع الرمال ص 85", "استنتج قوة الرياح ص 87", "ارسم حقلاً من الكثبان"],
            answers: [
                "أشكال النحت: الموائد الصحراوية، والمنخفضات. أشكال الترسيب: الكثبان الرملية، والغطاءات.",
                "الكثبان الهلالية (برخانات) لها ذراعان في اتجاه الريح، والكثبان الطولية تمتد بموازاة اتجاه الرياح.",
                "في الكثبان الهلالية، يكون الجانب المحدب في مواجهة الريح، والجانب المقعر (شديد الانحدار) في جهة الظل.",
                "تتكون الموائد نتيجة نحت الرياح للطبقات اللينة السفلى وبقاء الطبقات الصلبة العليا بارزة.",
                "تتجمع الرمال عندما تضعف سرعة الرياح أو تصطدم بعائق (صخرة أو نبات) فتسقط حمولتها.",
                "نستنتج قوة الرياح من حجم الحبيبات المنقولة؛ الرياح القوية تنقل الرمال الخشنة والحصى الصغير.",
                "يجب أن يوضح الرسم تكراراً لأشكال الكثبان مع توضيح سهم لاتجاه الرياح السائد."
            ]
        },
        {
            name: "التعرية النهرية", code: "river",
            tasks: ["اقرأ قطاع الوادي ص 95", "ميز بين الشلال والجنادل ص 98", "حدد النحت في المنعطف ص 100", "حلل رسم الدلتا ص 103", "فسر تكون السهل الفيضي ص 105", "استنتج مرحلة النهر ص 107", "ارسم بروفيلاً لنهر شاب"],
            answers: [
                "يكون قطاع الوادي على شكل حرف (V) في البداية، ثم يتسع تدريجياً مع تقدم عمر النهر.",
                "الشلال هو سقوط رأسي للماء نتيجة طبقة صلبة تعلو لينة، والجنادل هي صخور تعترض المجرى.",
                "يحدث النحت في (الجانب الخارجي) للمنعطف لقوة التيار، ويحدث الترسيب في (الجانب الداخلي).",
                "تتكون الدلتا عندما يصب النهر في بحر هادئ، فتترسب الرواسب على شكل مثلث (حرف دلتا اليوناني).",
                "يتكون السهل الفيضي من الرواسب الطميية التي يتركها النهر على جانبيه أثناء حدوث الفيضانات.",
                "إذا كان الوادي ضيقاً والسرعة كبيرة فهو (شباب)، وإذا اتسع الوادي وكثرت المنعطفات فهو (نضج).",
                "يجب أن يظهر الرسم قطاعاً عرضياً ضيقاً وعميقاً للمجرى المائي مع جدران شديدة الانحدار."
            ]
        },
        {
            name: "التعرية البحرية", code: "sea",
            tasks: ["اقرأ أجزاء الجرف ص 115", "ميز بين القوس والمسلة ص 118", "حدد خط الساحل ص 120", "حلل أثر الأمواج ص 122", "فسر تكون الألسنة ص 123", "استنتج نوع الساحل ص 124", "ارسم تصوراً لمسلة بحرية"],
            answers: [
                "الجرف هو حافة صخرية مطلة على البحر، والقاعدة هي الرصيف الذي تنحت فيه الأمواج.",
                "القوس فتحة في صخرة بارزة بالبحر، والمسلة هي العمود الصخري المتبقي بعد انهيار سقف القوس.",
                "خط الساحل هو الحد الفاصل بين اليابس والماء، ويتغير باستمرار نتيجة النحت والترسيب.",
                "تؤدي الأمواج لنحت مستمر في أسفل الجروف (نحت سفلي) مما يسبب انهيار الكتل الصخرية العليا.",
                "تتكون الألسنة (Spits) نتيجة ترسيب الرمال بواسطة التيارات البحرية عند مداخل الخليج.",
                "الساحل المتعرج يدل على كثرة النحت (ساحل صخري)، والساحل المستوي يدل على الترسيب (رملي).",
                "يجب أن يظهر الرسم عموداً صخرياً منفصلاً داخل الماء بعيداً عن خط الشاطئ الأصلي."
            ]
        }
    ];

    let currentS = 0, currentK = 0, student = {};
    let canvas, ctx, drawing = false;

    // تشغيل القائمة
    function start() {
        const n = document.getElementById('s-name').value;
        const g = document.getElementById('s-group').value;
        if(!n) return alert("سجل اسمك أولاً");
        student = {n, g};
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-menu').style.display = 'block';
        
        const grid = document.getElementById('menu-grid');
        data.forEach((s, i) => {
            grid.innerHTML += `<div class="card" onclick="openS(${i})"><h3>${s.name}</h3><p>عرض الأنشطة</p></div>`;
        });
    }

    function openS(idx) {
        currentS = idx;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('activity-screen').style.display = 'block';
        document.getElementById('sess-title').innerText = "الجلسة: " + data[idx].name;
        
        const tabs = document.getElementById('skill-tabs');
        tabs.innerHTML = "";
        skills.forEach((s, i) => {
            tabs.innerHTML += `<button class="skill-btn ${i==0?'active':''}" onclick="showK(${i})">${s}</button>`;
        });
        showK(0);
    }

    function showK(idx) {
        currentK = idx;
        document.querySelectorAll('.skill-btn').forEach((b, i) => b.className = `skill-btn ${i==idx?'active':''}`);
        document.getElementById('skill-display').innerText = "المهارة: " + skills[idx];
        document.getElementById('task-display').innerText = data[currentS].tasks[idx];
        document.getElementById('stu-ans').value = "";
        document.getElementById('model-answer-box').style.display = 'none';
        
        const isD = (idx === 6);
        document.getElementById('draw-zone').style.display = isD ? 'block' : 'none';
        document.getElementById('task-img').style.display = isD ? 'none' : 'block';
        document.getElementById('task-img').src = `${data[currentS].code}_${idx}.jpg`;
        if(isD) initCanvas();
    }

    function showModel() {
        document.getElementById('model-text').innerText = data[currentS].answers[currentK];
        document.getElementById('model-answer-box').style.display = 'block';
    }

    function initCanvas() {
        canvas = document.getElementById('canvas'); ctx = canvas.getContext('2d');
        canvas.onmousedown = () => drawing = true;
        canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
        canvas.onmousemove = (e) => {
            if(!drawing) return;
            const r = canvas.getBoundingClientRect();
            ctx.lineWidth = 3; ctx.strokeStyle = "#5D4037";
            ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
        };
    }

    function save() {
        const name = `${student.n}_${data[currentS].name}_${skills[currentK]}.png`;
        const link = document.createElement('a');
        link.download = name;
        link.href = canvas.toDataURL();
        if(currentK === 6) link.click();
        alert("تم حفظ استجابتك بنجاح يا " + student.n);
    }
</script>
</body>
</html>
